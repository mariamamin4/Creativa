<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="about.html" target="_blank" method="get">
    <fieldset>
        <legend>Personal Information</legend>

        <label>Name:</label>
        <input type="text" minlength="3" maxlength="15" placeholder="Enter Your Name" name="user" autofocus="on">
        
        <br>
        <br>
    <label>Email</label>
    <input type="email" placeholder="Enter Your Email" name="email" autocomplete="off">
    <br>
    <br>
    <label for="pass">Password:</label>
    <input id="pass" minlength="8" type="password" placeholder="Enter Your Pass" name="pass" >
    <br>
    <br>
    <label>Gender:</label>
    <input type="radio" name="gender" value="man" id="front" > <label for="front">Male</label>
    <input type="radio" name="gender" value="woman" checked id="back" > <label for="back">Female</label>
    <br>
    <br>
    <label>Fav Sport:</label>
    <input type="checkbox" name="sport" value="Football" checked> <label>Football</label>
    <input type="checkbox" name="sport" value="Basketball"> <label>Basketball</label>
    <input type="checkbox" name="sport" value="Tennis"> <label>Tennis</label>
    <input type="checkbox" name="sport" value="Swimming"> <label>Swimming</label>

    <label>Upload cv:</label>
    <input type="file" name="cv"/>
<br> <br>
<label>Birthday:</label>
<input type="date" name="birthday"/>
<input type="month" name="month"/>
<input type="week" name="week"/>
<input type="datetime-local" name="time"/>
<br><br>
<label>Quantity: </label>
<input type="number" name="Quantity" min="3" max="21" step="3" >
<br> <br>
<label>Price:</label>
<input type="range" name="price" min="0" max="150" >
<br> <br>
<label>Color:</label>
<input type="color" name="color">
<br> <br>
<label>Country:</label>

<select name="country">
    
    <optgroup label="Arab Countries">
        <option>Egypt</option>
        <option value="saudi Arabia">KSA</option>
        <option selected>Qatar</option>
    </optgroup>

    <optgroup label="Foreign Countries">
        <option>USA</option>
        <option>France</option>
        <option>Germany</option>
    </optgroup>

</select>
          <br>
          <br>
          <label>Fav colors</label>
          <input type="text" name="favcolors" list="favcolor"/>
          <datalist id="favcolor">
            <option>Red</option>
            <option>Yellow</option>
            <option>Green</option>
            <option>Blue</option>
            <option>Gold</option>
          </datalist>
              <br> <br>
              <label>Message: </label>
              <br><br>
              <textarea name="message" placeholder="Enter your message.." cols="35" rows="5" maxlength="20"></textarea>
    <br> <br>
    <input type="hidden" name="id" value="123">
    <input type="submit" value="Login">
    <input type="submit" value="Create New Account" formaction="register.html" formmethod="post"  formtarget="_self">
    <input type="reset">
</fieldset>
    </form>
    
</body>
</html>
